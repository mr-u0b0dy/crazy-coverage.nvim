[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crazy-coverage-python-example"
version = "0.1.0"
description = "Python coverage example for crazy-coverage.nvim"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
